[project]
name = "v8-run-guard"
version = "0.1.0"
description = "V8 run guard and MANIFEST/INPUTS format shared by stages A-D"
requires-python = ">=3.12,<3.14"
dependencies = [
    "prereg==0.4.2",
    "provenance-core==0.4.2",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["v8_run_guard.py", "v8_manifest.py", "v8_test_report.py"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
