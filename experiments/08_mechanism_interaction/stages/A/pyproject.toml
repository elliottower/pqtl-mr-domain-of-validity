[project]
name = "exp08-stage-a"
version = "0.1.0"
description = "V8 stage A: enumeration, eligibility, mechanism labels, instrument and outcome-GWAS selection"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.2.6",
    "pandas==2.2.3",
    "pyarrow==21.0.0",
    "openpyxl==3.1.5",
    "pydantic==2.11.7",
    "v8-run-guard==0.1.0",
]

[dependency-groups]
dev = [
    "pytest==8.4.1",
]

[tool.uv]
package = false

[tool.uv.sources]
v8-run-guard = { path = "../run_guard", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
